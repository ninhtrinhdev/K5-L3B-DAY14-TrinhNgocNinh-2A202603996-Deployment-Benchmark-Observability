# Railway: build từ Dockerfile, kiểm /health trước khi chuyển traffic.
# Port do Railway cấp qua biến PORT (CMD trong Dockerfile đọc ${PORT:-8000}).
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard / `railway variables`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
